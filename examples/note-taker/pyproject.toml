[project]
name = "note-taker"
version = "0.1.0"
authors = [
    { name = "yactouat" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# Flat layout: the CLI module and the store and commands packages sit at the app root.
[tool.setuptools]
py-modules = ["cli"]
packages = ["store", "commands"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
note-taker = "cli:main"
