[project]
name = "joy"
version = "0.1.0"
authors = [
    { name = "yactouat" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# Flat layout: the CLI module sits at the root of this folder.
[tool.setuptools]
py-modules = ["joy", "task_ledger"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[project.scripts]
joy = "joy:main"
